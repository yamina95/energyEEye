<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EnergyEye</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <section id="signin" class="signin-section section">
    <div class="container signin-wrap">

      <div class="signin-info">
        <span class="eyebrow">Access your account</span>
        <h2>Log in and view your electricity usage instantly</h2>
        <p>
          EnergyEye helps users monitor electricity usage, estimate bills,
          and connect AI meter readings to the dashboard.
        </p>
      </div>

      <div class="auth-column">
        <div class="signin-card">
          <h3>Sign in</h3>
          <p class="card-subtitle">Enter your username and password</p>

          <form id="loginForm">
            <div class="input-group">
              <label for="username">Username</label>
              <input type="text" id="username" placeholder="Enter your username" required />
            </div>

            <div class="input-group">
              <label for="password">Password</label>
              <input type="password" id="password" placeholder="Enter your password" required />
            </div>

            <div class="signin-row">
              <a href="#" onclick="forgotPassword()">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary full">Login</button>

            <p id="loginMessage" class="small-text error-text"></p>
          </form>
        </div>
      </div>

    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
